<style>
:root{--bg:#f5f3f0;--sf:#fff;--ink:#1c1714;--mut:#7a6b5f;--ln:#ddd5cc;--ac:#6b4423;--af:#fff;--er:#b3261e;--inv:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--sf:#221b16;--ink:#efe8e0;--mut:#a89888;--ln:#3a2f27;--ac:#c9a07a;--af:#1c1714;--er:#ff8a80;--inv:1}}
:root[data-theme="dark"]{--bg:#17120f;--sf:#221b16;--ink:#efe8e0;--mut:#a89888;--ln:#3a2f27;--ac:#c9a07a;--af:#1c1714;--er:#ff8a80;--inv:1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px 0;z-index:2}
.lg{font:700 26px 'Barlow Condensed',sans-serif;letter-spacing:.3px;display:flex;align-items:center;gap:10px}.lg small{font:500 14px Barlow,sans-serif;color:var(--mut)}.logo{height:36px;filter:invert(var(--inv))}a{color:var(--ac);font-weight:600;margin-right:12px}button.s{background:none;border:0;color:var(--ac);padding:0 4px;font-size:14px}#toast a{color:inherit;text-decoration:underline;margin-left:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}nav button{flex:1;background:none;border:0;border-top:3px solid transparent;border-radius:0;padding:12px 2px;font:600 13px Barlow,sans-serif;color:var(--mut)}nav .on{color:var(--ink);border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
h2{font:700 30px 'Barlow Condensed',sans-serif;margin:8px 0}h3{font:700 20px 'Barlow Condensed',sans-serif;margin:26px 0 4px;color:var(--ac)}
.r{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mut)}.bad,.bad small{color:var(--er)}.dn{opacity:.45}.dn .nm{text-decoration:line-through}.mu{color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px;min-width:0;width:100%}.r input,.r select{width:auto;flex:1}.r input[type=number]{max-width:120px;flex:none;text-align:right}.r input[type=checkbox]{flex:none;width:22px;height:22px}
label{display:block;margin:10px 0;color:var(--mut)}label input,label textarea{margin-top:3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
button{font:600 15px Barlow,sans-serif;border:1px solid var(--ac);background:var(--ac);color:var(--af);border-radius:6px;padding:9px 14px}button.g{background:none;color:var(--ac)}button.x{background:none;border:0;color:var(--mut);font-size:22px;padding:0 6px}
.tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln)}.tot .big{font:700 34px 'Barlow Condensed',sans-serif;color:var(--ac);border:0}.tot .sub{color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px;border-radius:6px;display:none}
